<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 380" width="100%" role="img" aria-label="The feasible blends, and the cheapest one">
<title>The feasible blends, and the cheapest one</title><desc>A two-variable linear program drawn as a polygon. Every blend satisfying the batch, protein, fibre and silo constraints lies inside the shaded region. The cheapest blend sits on a corner.</desc>
<style>text{font:13px/1.25 "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink, #0a0a0a)} .lbl{font-size:11.5px;fill:var(--muted, #6b6b6b)} .tag{font-size:12px;fill:var(--d4, #2b2b28)}</style>
<line x1="58" x2="696" y1="334.0" y2="334.0" stroke="var(--rule, #dcdcda)" stroke-width=".5"/>
<text class="lbl" x="50" y="338.0" text-anchor="end">0</text>
<line x1="58" x2="696" y1="253.5" y2="253.5" stroke="var(--rule, #dcdcda)" stroke-width=".5"/>
<line x1="58" x2="696" y1="172.9" y2="172.9" stroke="var(--rule, #dcdcda)" stroke-width=".5"/>
<text class="lbl" x="50" y="176.9" text-anchor="end">40</text>
<line x1="58" x2="696" y1="92.4" y2="92.4" stroke="var(--rule, #dcdcda)" stroke-width=".5"/>
<text class="lbl" x="58.0" y="352" text-anchor="middle">0</text>
<text class="lbl" x="262.2" y="352" text-anchor="middle">40</text>
<text class="lbl" x="466.3" y="352" text-anchor="middle">80</text>
<text class="lbl" x="670.5" y="352" text-anchor="middle">120</text>
<polygon points="568.4,334.0 653.5,334.0 551.4,92.4 343.4,92.4 364.2,172.9" fill="var(--d1, #b4b4ae)" opacity=".38"/>
<line x1="58.0" y1="92.4" x2="696.0" y2="92.4" stroke="var(--d3, #5c5c56)" stroke-width="1.4"/>
<text class="tag" x="129.8" y="87.4" text-anchor="start">silo</text>
<line x1="180.5" y1="28.0" x2="568.4" y2="334.0" stroke="var(--d3, #5c5c56)" stroke-width="1.4"/>
<text class="tag" x="506.1" y="286.2" text-anchor="end">batch</text>
<line x1="326.7" y1="28.0" x2="406.0" y2="334.0" stroke="var(--d3, #5c5c56)" stroke-width="1.4"/>
<text class="tag" x="362.3" y="191.3" text-anchor="end">protein</text>
<line x1="524.2" y1="28.0" x2="653.5" y2="334.0" stroke="var(--d3, #5c5c56)" stroke-width="1.4"/>
<text class="tag" x="558.0" y="84.2" text-anchor="start">fibre</text>
<line x1="298.1" y1="28.0" x2="437.7" y2="334.0" stroke="var(--d3, #5c5c56)" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="tag" x="399.0" y="261.7" text-anchor="end">same price all along here</text>
<circle cx="568.4" cy="334.0" r="3" fill="var(--paper, #ffffff)" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<circle cx="653.5" cy="334.0" r="3" fill="var(--paper, #ffffff)" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<circle cx="551.4" cy="92.4" r="3" fill="var(--paper, #ffffff)" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<circle cx="343.4" cy="92.4" r="3" fill="var(--paper, #ffffff)" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<text class="lbl" x="317.6" y="79.8" text-anchor="middle">next best, $38.75</text>
<circle cx="364.2" cy="172.9" r="4.5" fill="var(--signal, #d6001c)" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<text x="377.2" y="162.9" fill="var(--signal, #d6001c)" style="font-size:13px">60 soybean + 40 corn = $37.20</text>
<line x1="58" y1="334.0" x2="696" y2="334.0" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<line x1="58" y1="28" x2="58" y2="334.0" stroke="var(--d4, #2b2b28)" stroke-width="1.5"/>
<text class="lbl" x="377" y="376" text-anchor="middle">soybean meal, lb</text>
<text class="lbl" x="14" y="181" transform="rotate(-90 14 181)" text-anchor="middle">corn meal, lb</text>
</svg>
