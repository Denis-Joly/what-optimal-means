<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" width="100%" role="img" aria-label="What each of the nine nutritional minimums costs per day">
<title>What each of the nine nutritional minimums costs per day</title><desc>A single horizontal bar, the daily cost of the cheapest diet, split into the contribution of each binding constraint. Four of the nine minimums contribute nothing.</desc>
<style>text{font:11px/1.2 "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink, #0a0a0a)} .lbl{font-size:10px;fill:var(--muted, #6b6b6b)} .tag{font-size:10px;fill:var(--d4, #2b2b28)}</style>
<rect x="20.0" y="46" width="279.6" height="70" fill="var(--d4, #2b2b28)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="159.8" y="85" text-anchor="middle" fill="var(--paper, #ffffff)">riboflavin</text>
<text class="lbl" x="159.8" y="38" text-anchor="middle">4.42&#162;</text>
<rect x="299.6" y="46" width="166.5" height="70" fill="var(--d3, #5c5c56)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="382.9" y="85" text-anchor="middle" fill="var(--paper, #ffffff)">calories</text>
<text class="lbl" x="382.9" y="38" text-anchor="middle">2.63&#162;</text>
<rect x="466.1" y="46" width="160.8" height="70" fill="var(--d2, #8a8a83)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="546.5" y="85" text-anchor="middle" fill="var(--ink, #0a0a0a)">calcium</text>
<text class="lbl" x="546.5" y="38" text-anchor="middle">2.54&#162;</text>
<rect x="626.9" y="46" width="68.4" height="70" fill="var(--d1, #b4b4ae)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="661.1" y="85" text-anchor="middle" fill="var(--ink, #0a0a0a)">vitamin C</text>
<text class="lbl" x="661.1" y="38" text-anchor="middle">1.08&#162;</text>
<rect x="695.3" y="46" width="12.7" height="70" fill="var(--rule, #dcdcda)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text class="lbl" x="701.7" y="130" text-anchor="middle">vitamin A</text>
<text class="lbl" x="701.7" y="38" text-anchor="middle">0.20&#162;</text>
<text x="20" y="20">the whole bar is 10.87&#162; a day, which is the price of the diet</text>
<text class="lbl" x="708" y="164" text-anchor="end">costing nothing at the margin: protein, iron, thiamine, niacin</text>
</svg>
