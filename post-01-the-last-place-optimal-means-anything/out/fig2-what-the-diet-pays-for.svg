<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 200" width="100%" role="img" aria-label="What each of the nine nutritional minimums costs per day">
<title>What each of the nine nutritional minimums costs per day</title><desc>A single horizontal bar, the daily cost of the cheapest diet, split into the contribution of each binding constraint. Four of the nine minimums contribute nothing.</desc>
<style>text{font:13px/1.25 "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink, #0a0a0a)} .lbl{font-size:11.5px;fill:var(--muted, #6b6b6b)} .tag{font-size:12px;fill:var(--d4, #2b2b28)}</style>
<rect x="20.0" y="46" width="274.8" height="98" fill="var(--d4, #2b2b28)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="157.4" y="99" text-anchor="middle" fill="var(--paper, #ffffff)">riboflavin</text>
<text class="lbl" x="157.4" y="38" text-anchor="middle">4.42&#162;</text>
<rect x="294.8" y="46" width="163.6" height="98" fill="var(--d3, #5c5c56)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="376.6" y="99" text-anchor="middle" fill="var(--paper, #ffffff)">calories</text>
<text class="lbl" x="376.6" y="38" text-anchor="middle">2.63&#162;</text>
<rect x="458.4" y="46" width="158.0" height="98" fill="var(--d2, #8a8a83)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<text x="537.3" y="99" text-anchor="middle" fill="var(--ink, #0a0a0a)">calcium</text>
<text class="lbl" x="537.3" y="38" text-anchor="middle">2.54&#162;</text>
<rect x="616.3" y="46" width="67.2" height="98" fill="var(--d1, #b4b4ae)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<line x1="649.9" y1="144" x2="649.9" y2="151" stroke="var(--rule, #dcdcda)" stroke-width="1"/>
<text class="lbl" x="649.9" y="160" text-anchor="middle">vitamin C</text>
<text class="lbl" x="649.9" y="38" text-anchor="middle">1.08&#162;</text>
<rect x="683.6" y="46" width="12.4" height="98" fill="var(--rule, #dcdcda)" stroke="var(--paper, #ffffff)" stroke-width="1"/>
<line x1="689.8" y1="144" x2="689.8" y2="166" stroke="var(--rule, #dcdcda)" stroke-width="1"/>
<text class="lbl" x="689.8" y="175" text-anchor="middle">vitamin A</text>
<text class="lbl" x="689.8" y="38" text-anchor="middle">0.20&#162;</text>
<text x="20" y="20">the whole bar is 10.87&#162; a day, which is the price of the diet</text>
<text class="lbl" x="696" y="192" text-anchor="end">costing nothing at the margin: protein, iron, thiamine, niacin</text>
</svg>
