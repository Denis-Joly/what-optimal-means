<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" role="img" aria-label="A saddle point, in two slices">
<title>A saddle point, in two slices</title><desc>Two small plots of the surface z = x squared minus y squared through the same point. Along one direction the point is the bottom of a curve; along the other it is the top.</desc>
<style>text{font:11px/1.2 "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink, #0a0a0a)} .lbl{font-size:10px;fill:var(--muted, #6b6b6b)} .tag{font-size:10px;fill:var(--d4, #2b2b28)}</style>
<text x="60" y="38">slice along x:  z = x&#178;</text>
<line x1="60" y1="132" x2="345" y2="132" stroke="var(--rule, #dcdcda)" stroke-width=".5"/>
