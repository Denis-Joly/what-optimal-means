<circle cx="557.5" cy="97.0" r="4.5" fill="var(--signal, #d6001c)"/>
<line x1="511.5" y1="97.0" x2="603.5" y2="97.0" stroke="var(--signal, #d6001c)" stroke-width="1" stroke-dasharray="3 3"/>
