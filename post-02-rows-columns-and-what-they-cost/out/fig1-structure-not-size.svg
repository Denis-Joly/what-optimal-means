<title id="fig1-static-title">Stigler looks extreme by percentage, not by relationships per choice</title>
<desc id="fig1-static-desc">Two direct comparisons with 98 Netlib linear programs. Stigler is 84.0 percent dense versus a Netlib median of 0.97 percent. It has 8.4 nonzeros per column versus a Netlib median of 4.8; 21 Netlib models have more.</desc>
