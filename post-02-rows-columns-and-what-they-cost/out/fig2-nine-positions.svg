<title id="fig2-static-title">Four loose nutrient floors leave room for only five foods</title>
<desc id="fig2-static-desc">Stigler&#x27;s standard-form model has 77 food columns and 9 surplus columns. A basis uses 9 columns. In the reported optimum four positive surpluses occupy four positions, leaving five food positions.</desc>
